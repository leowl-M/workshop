          - name: tempo
            label: Tempo
            type: object
            fields:
              - { name: frase, label: Frase, type: text }
          - name: partire
            label: Partire
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: sottotitolo, label: Sottotitolo, type: text }
              - { name: skill_1, label: Skill 1, type: text }
              - { name: skill_2, label: Skill 2, type: text }
              - { name: skill_3, label: Skill 3, type: text }
              - { name: skill_4, label: Skill 4, type: text }
              - { name: skill_5, label: Skill 5, type: text }
              - { name: skill_6, label: Skill 6, type: text }
              - { name: skill_7, label: Skill 7, type: text }
          - name: risorse
            label: Risorse
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: sottotitolo, label: Sottotitolo, type: text }
          - name: fine
            label: Fine
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: sottotitolo, label: Sottotitolo, type: text }
      - name: FAMILIES
        label: Famiglie di skill
        type: object
        list: { collapsible: true }
        fields:
          - { name: id, label: ID (non cambiare), type: string }
          - { name: label, label: Nome, type: string }
          - { name: blurb, label: Descrizione, type: text }
      - name: SKILLS
        label: Skill (anello)
        type: object
        list: { collapsible: true }
        fields:
          - { name: family, label: Famiglia (id), type: string }
          - { name: name, label: Nome, type: string }
          - { name: what, label: Cosa fa (max 90 caratteri), type: text }
          - { name: when, label: Quando (max 110 caratteri), type: text }
      - name: GROUPS
        label: Gruppi di progetti
        type: object
        list: { collapsible: true }
        fields:
          - { name: id, label: ID (non cambiare), type: string }
          - { name: label, label: Nome, type: string }
          - { name: line, label: Frase, type: text }
      - name: PROJECTS
        label: Progetti
        type: object
        list: { collapsible: true }
        fields:
          - { name: id, label: ID (non cambiare), type: string }
          - { name: name, label: Nome, type: string }
          - { name: kind, label: Tipo, type: string }
          - { name: group, label: Gruppo (figma, app, web), type: string }
          - { name: problem, label: Il problema (vuoto = nascosto), type: text }
          - { name: solution, label: Cosa fa, type: text }
          - { name: details, label: Dettagli, type: string, list: true }
          - { name: stack, label: Tecnologie, type: string }
          - { name: imgs, label: Immagini (img-NN), type: string, list: true }
      - name: PRISMA_SIM
        label: Demo di Prisma
        type: object
        fields:
          - name: shift
            type: object
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: items, label: Bolle, type: string, list: true }
              - { name: pick, label: Bolla scelta (deve essere tra le bolle), type: string }
              - { name: hint, label: Suggerimento, type: string }
              - { name: out, label: File creato, type: string }
          - name: cmd
            type: object
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: items, label: Bolle, type: string, list: true }
              - { name: pick, label: Bolla scelta (deve essere tra le bolle), type: string }
              - { name: hint, label: Suggerimento, type: string }
              - { name: out, label: File creato, type: string }
          - name: ctrl
            type: object
            fields:
              - { name: title, label: Titolo, type: string }
              - { name: items, label: Bolle, type: string, list: true }
              - { name: pick, label: Bolla scelta (deve essere tra le bolle), type: string }
              - { name: hint, label: Suggerimento, type: string }
              - { name: toast, label: Messaggio, type: string }
      - name: METHOD
        label: Metodo (9 passi)
        type: object
        list: { collapsible: true }
        fields:
          - { name: skill, label: Skill (facoltativa), type: string }
          - { name: name, label: Nome, type: string }
          - { name: what, label: Testo, type: text }
          - { name: file, label: File citato, type: string }
          - { name: here, label: File acceso nella cartella (nome in FOLDER), type: string }
          - { name: lines, label: Righe dell'estratto, type: string, list: true }
      - name: FOLDER
        label: Metodo, cartella di Claude Code
        type: object
        list: { collapsible: true }
        fields:
          - { name: name, label: Nome file o cartella, type: string }
          - { name: d, label: Livello (0 = radice), type: number }
          - { name: note, label: A cosa serve, type: string }
      - name: METHOD_KEYS
        label: Metodo, tasti della tastiera
        type: string
        list: true
      - name: KIT
        label: Risorse (kit)
        type: object
        list: { collapsible: true }
        fields:
          - { name: h, label: Titolo gruppo, type: string }
          - { name: p, label: Descrizione gruppo, type: text }
          - name: rows
            label: Voci
            type: object
            list: { collapsible: true }
            fields:
              - { name: href, label: Link (facoltativo), type: string }
              - { name: cmds, label: Comandi da copiare, type: string, list: true }
              - { name: name, label: Nome, type: string }
              - { name: what, label: Cosa fa, type: text }
              - { name: use, label: Come si usa, type: string }
              - { name: src, label: Da dove, type: string }
              - { name: mine, label: Creata da me, type: boolean }
      - name: WEBAPPS
        label: Strumenti web (sfera)
        type: object
        list: { collapsible: true }
        fields:
          - { name: preview, label: Anteprima (nome file in media/tools), type: string }
          - { name: name, label: Nome, type: string }
          - { name: href, label: Link, type: string }
          - { name: kind, label: Tipo, type: string }
      - name: KEYS
        label: Tastiera 3D iniziale
        type: object
        list: { collapsible: true }
        fields:
          - { name: label, label: Scritta, type: string }
          - { name: u, label: Larghezza (1 = tasto normale), type: number }
          - { name: color, label: Colore (yellow, cream, blue, deep), type: string }
          - { name: to, label: Progetto (id), type: string }
      - name: SLOTS
        label: Didascalie immagini
        type: object
        fields:
          - { name: img-01, label: IMG-01, type: string }
          - { name: img-02, label: IMG-02, type: string }
          - { name: img-03, label: IMG-03, type: string }
          - { name: img-04, label: IMG-04, type: string }
          - { name: img-05, label: IMG-05, type: string }
          - { name: img-06, label: IMG-06, type: string }
          - { name: img-07, label: IMG-07, type: string }
          - { name: img-08, label: IMG-08, type: string }
          - { name: img-09, label: IMG-09, type: string }
          - { name: img-10, label: IMG-10, type: string }
      - name: SLOT_SIZE
        label: Misura consigliata immagini
        type: string
