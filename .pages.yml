              - { name: passo1_esempio, label: Passo1 esempio, type: text }
              - { name: passo2_titolo, label: Passo2 titolo, type: text }
              - { name: passo2_testo, label: Passo2 testo, type: text }
              - { name: passo2_esempio, label: Passo2 esempio, type: text }
              - { name: passo3_titolo, label: Passo3 titolo, type: text }
              - { name: passo3_testo, label: Passo3 testo, type: text }
              - { name: passo3_esempio, label: Passo3 esempio, type: text }
          - name: progetti
            label: Progetti
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
          - name: composer
            label: Composer, come funziona
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: passo1_titolo, label: Passo1 titolo, type: text }
              - { name: passo1_testo, label: Passo1 testo, type: text }
              - { name: passo2_titolo, label: Passo2 titolo, type: text }
              - { name: passo2_testo, label: Passo2 testo, type: text }
              - { name: passo3_titolo, label: Passo3 titolo, type: text }
              - { name: passo3_testo, label: Passo3 testo, type: text }
              - { name: passo4_titolo, label: Passo4 titolo, type: text }
              - { name: passo4_testo, label: Passo4 testo, type: text }
          - name: editor
            label: Editor, come funziona
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: passo1_titolo, label: Passo1 titolo, type: text }
              - { name: passo1_testo, label: Passo1 testo, type: text }
