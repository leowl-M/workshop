              - { name: cartella_testo, label: Cartella testo, type: text }
              - { name: giro_titolo, label: Ciclo titolo, type: text }
              - { name: giro_testo, label: Ciclo testo, type: text }
              - { name: giro_doc, label: Ciclo riquadro, type: text }
              - { name: regole_titolo, label: CLAUDE.md titolo, type: text }
              - { name: regole_testo, label: CLAUDE.md testo, type: text }
              - { name: regole_doc, label: CLAUDE.md riquadro, type: text }
              - { name: skill_titolo, label: Skill titolo, type: text }
              - { name: skill_testo, label: Skill testo, type: text }
              - { name: skill_doc, label: Skill riquadro, type: text }
              - { name: permesso_titolo, label: Permesso titolo, type: text }
              - { name: permesso_testo, label: Permesso testo, type: text }
              - { name: permesso_doc, label: Permesso riquadro, type: text }
