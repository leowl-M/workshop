# Pages CMS (https://app.pagescms.org): edits content.json and commits to master; GitHub Pages republishes.
# Every key of content.json is declared here, so a save never drops data. A new key in content.json needs a field here too.
content:
  - name: presentazione
    label: Presentazione
    type: file
    path: content.json
    format: json
    fields:
      - name: SHARE_URL
        label: Link del QR finale
        type: string
      - name: TEXTS
        label: Testi delle slide
        description: "HTML ammesso: <mark>evidenziato</mark>, <em>corsivo</em>, <code>codice</code>."
        type: object
        fields:
          - name: intro
            label: Intro
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: autore, label: Autore, type: text }
              - { name: manifesto, label: Manifesto, type: text }
          - name: prima
            label: Prima
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: sottotitolo, label: Sottotitolo, type: text }
              - { name: card1_titolo, label: Card1 titolo, type: text }
              - { name: card1_testo, label: Card1 testo, type: text }
              - { name: card2_titolo, label: Card2 titolo, type: text }
              - { name: card2_testo, label: Card2 testo, type: text }
              - { name: card3_titolo, label: Card3 titolo, type: text }
              - { name: card3_testo, label: Card3 testo, type: text }
              - { name: card4_titolo, label: Card4 titolo, type: text }
              - { name: card4_testo, label: Card4 testo, type: text }
          - name: svolta
            label: Svolta
            type: object
            fields:
              - { name: domanda, label: Domanda, type: text }
              - { name: frase1, label: Frase1, type: text }
              - { name: frase2, label: Frase2, type: text }
          - name: metodo
            label: Metodo
            type: object
            fields:
              - { name: kicker, label: Kicker, type: text }
              - { name: titolo, label: Titolo, type: text }
              - { name: sottotitolo, label: Sottotitolo, type: text }
              - { name: sempre_kicker, label: Sempre kicker, type: text }
              - { name: sempre_titolo, label: Sempre titolo, type: text }
              - { name: sempre_ponytail, label: Sempre ponytail, type: text }
